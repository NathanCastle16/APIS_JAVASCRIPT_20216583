<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pecera - APIs Nativas JavaScript</title>
<style>
body{font-family:Arial,sans-serif;text-align:center}
#pecera{width:600px;min-height:400px;margin:20px auto;background-color:lightblue;border:4px solid #1565c0;display:grid;gap:2px;padding:5px}
.celda{border:1px solid white;min-height:50px}
#juego{width:600px;margin:20px auto}
.peces{display:flex;justify-content:space-around;margin-top:20px}
.zonaPez{width:220px;height:140px;border:2px dashed white;display:flex;flex-direction:column;justify-content:center;align-items:center}
.pez{font-size:60px}
#burbujas{width:600px;min-height:80px;border:2px solid gray;margin:20px auto;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:10px}
.burbuja{width:45px;height:45px;border-radius:50%;cursor:grab}
.nemo{background-color:orange}.dory{background-color:blue}
button{margin:5px;padding:8px 15px}
</style>
</head>
<body>
<h1>Pecera de Nemo y Dory</h1>

<label for="dimension">Dimensión:</label>
<input type="number" id="dimension" value="6" min="1">
<button onclick="generarPecera()">Crear pecera</button>

<div id="pecera"></div>

<div id="juego">
<button onclick="contarNemo()">Nemo vio un pez</button>
<button onclick="contarDory()">Dory vio un pez</button>

<div class="peces">
<div id="zonaNemo" class="zonaPez"
ondragover="permitirSoltar(event)"
ondrop="soltarBurbuja(event,'nemo')">
<div class="pez">🐠</div>
<strong>Nemo</strong>
<span>Contador: <span id="contadorNemo">0</span></span>
</div>

<div id="zonaDory" class="zonaPez"
ondragover="permitirSoltar(event)"
ondrop="soltarBurbuja(event,'dory')">
<div class="pez">🐟</div>
<strong>Dory</strong>
<span>Contador: <span id="contadorDory">0</span></span>
</div>
</div>
</div>

<h3>Burbujas</h3>
<div id="burbujas"></div>

<script>
// PREGUNTA 1 - DOM
function crearPecera(x){
let pecera=document.getElementById("pecera");
pecera.innerHTML="";
pecera.style.gridTemplateColumns="repeat("+x+",1fr)";
for(let i=0;i<x*x;i++){
let celda=document.createElement("div");
celda.className="celda";
pecera.appendChild(celda);
}
}

function generarPecera(){
let x=parseInt(document.getElementById("dimension").value);
if(isNaN(x)||x<=0){return;}
crearPecera(x);
}

// PREGUNTA 2 - WEB STORAGE
let nemo=localStorage.getItem("contadorNemo");
let dory=sessionStorage.getItem("contadorDory");

if(nemo==null){nemo=0;}else{nemo=parseInt(nemo);}
if(dory==null){dory=0;}else{dory=parseInt(dory);}

function actualizarContadores(){
document.getElementById("contadorNemo").innerHTML=nemo;
document.getElementById("contadorDory").innerHTML=dory;
}

function contarNemo(){
nemo++;
localStorage.setItem("contadorNemo",nemo);
actualizarContadores();
}

function contarDory(){
dory++;
sessionStorage.setItem("contadorDory",dory);
actualizarContadores();
}

// CAMBIO PROGRESIVO DE COLOR
let pasoColor=0;
function cambiarColor(){
if(pasoColor<100){pasoColor++;}
let rojo=Math.round(173-(73*pasoColor/100));
let verde=Math.round(216+(39*pasoColor/100));
let azul=Math.round(230-(130*pasoColor/100));
document.getElementById("pecera").style.backgroundColor=
"rgb("+rojo+","+verde+","+azul+")";
}
setInterval(cambiarColor,1000);

// PREGUNTA 3 - DRAG AND DROP
let numeroBurbuja=0;

function crearBurbuja(){
numeroBurbuja++;

let burbuja=document.createElement("div");
burbuja.id="burbuja"+numeroBurbuja;
burbuja.className="burbuja";
burbuja.draggable=true;

let tipo;
if(numeroBurbuja%2==0){
tipo="dory";
burbuja.classList.add("dory");
}else{
tipo="nemo";
burbuja.classList.add("nemo");
}

burbuja.setAttribute("data-tipo",tipo);
burbuja.addEventListener("dragstart",arrastrarBurbuja);
document.getElementById("burbujas").appendChild(burbuja);
}

function arrastrarBurbuja(event){
event.dataTransfer.setData("text",event.target.id);
}

function permitirSoltar(event){
event.preventDefault();
}

function soltarBurbuja(event,pez){
event.preventDefault();

let id=event.dataTransfer.getData("text");
let burbuja=document.getElementById(id);
if(burbuja==null){return;}

let tipo=burbuja.getAttribute("data-tipo");

if(tipo==pez){
if(pez=="nemo"){
contarNemo();
}else{
contarDory();
}
burbuja.remove();
}
}

setInterval(crearBurbuja,2000);

// INICIO
crearPecera(6);
actualizarContadores();
</script>
</body>
</html>
